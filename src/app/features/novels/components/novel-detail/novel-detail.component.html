<div class="p-4 bg-white shadow rounded-lg">
  <img [src]="image()" [alt]="title()" class="w-48 h-auto rounded-lg">
  <div class="px-4">
    <h1 class="text-xl font-semibold leading-tight tracking-tight pb-1">{{ title() }}</h1>
  </div>
  <p class="text-gray-600 mt-2">{{ description() }}</p>
  <div class="mt-4">
    <h3 class="font-semibold">Genres:</h3>
    <div class="flex gap-2 mt-1">
      @for (genre of genres(); track $index) {
        <span class="bg-[var(--color-primary)] text-white px-3 py-1 rounded-full text-sm">{{ genre }}</span>
      }
    </div>
  </div>
  <div class="mt-4">
    <h3 class="font-semibold">Tags:</h3>
    <div class="flex gap-2 mt-1">
      @for (tag of tags(); track $index) {
        <span class="bg-[var(--color-secondary)] text-white px-3 py-1 rounded-full text-sm">{{ tag }}</span>
      }
    </div>
  </div>
</div>
