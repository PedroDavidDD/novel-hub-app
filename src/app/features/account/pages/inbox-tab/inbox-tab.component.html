<div class="bg-[var(--color-bg-card)] border border-[var(--color-border)] rounded-2xl p-6 sm:p-8 shadow-[var(--shadow-medium)]">
  <div class="flex items-center justify-between pb-4 border-b border-[var(--color-border)]">
    <div>
      <h2 class="text-xl font-bold text-[var(--color-black)]">Notifications & Inbox</h2>
      <p class="text-xs text-[var(--color-description)]">Avisos del sistema y lanzamientos de capítulos</p>
    </div>
    <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-[var(--color-primary)] text-white">
      1 nuevo
    </span>
  </div>

  <div class="divide-y divide-[var(--color-border)]/50 mt-4">
    @for (msg of messages; track msg.id) {
      <div class="py-4 flex items-start justify-between gap-4 cursor-pointer hover:bg-[var(--color-section)]/50 -mx-4 px-4 rounded-xl transition-colors">
        <div class="flex items-start gap-3">
          <div class="mt-1 flex-shrink-0">
            @if (msg.isUnread) {
              <span class="block size-2.5 rounded-full bg-[var(--color-primary)]"></span>
            } @else {
              <span class="block size-2.5 rounded-full bg-transparent"></span>
            }
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm text-[var(--color-black)]">{{ msg.sender }}</span>
              <span class="text-xs text-[var(--color-description)]">• {{ msg.date }}</span>
            </div>
            <h4 class="font-semibold text-sm text-[var(--color-black)] mt-0.5">{{ msg.subject }}</h4>
            <p class="text-xs text-[var(--color-description)] mt-1 line-clamp-1" [title]="msg.preview">
              {{ msg.preview }}
            </p>
          </div>
        </div>

        <button type="button" class="text-xs text-[var(--color-description)] hover:text-[var(--color-primary)] flex-shrink-0 transition-colors">
          Marcar leída
        </button>
      </div>
    }
  </div>
</div>
