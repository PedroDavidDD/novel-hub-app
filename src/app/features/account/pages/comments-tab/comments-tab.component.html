<div class="bg-[var(--color-bg-card)] border border-[var(--color-border)] rounded-2xl p-6 sm:p-8 shadow-[var(--shadow-medium)]">
  <div class="pb-4 border-b border-[var(--color-border)]">
    <h2 class="text-xl font-bold text-[var(--color-black)]">My Comments</h2>
    <p class="text-xs text-[var(--color-description)]">Comentarios y aportes realizados en los capítulos</p>
  </div>

  <div class="divide-y divide-[var(--color-border)]/50 mt-4">
    @for (c of comments; track c.id) {
      <div class="py-5">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm text-[var(--color-black)]" [title]="c.novelTitle">{{ c.novelTitle }}</span>
            <span class="text-xs text-[var(--color-primary)] font-medium">({{ c.chapter }})</span>
          </div>
          <span class="text-xs text-[var(--color-description)]">{{ c.date }}</span>
        </div>
        <p class="text-sm text-[var(--color-black)] bg-[var(--color-section)] p-3.5 rounded-xl border border-[var(--color-border)]/40">
          "{{ c.comment }}"
        </p>
        <div class="flex items-center gap-1.5 mt-2 text-xs text-[var(--color-description)]">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4 text-red-500">
            <path d="m9.653 16.915-.005-.003-.019-.01a20.759 20.759 0 0 1-1.16-1.077c-1.89-1.854-4.81-4.869-4.81-8.325 0-2.88 2.14-5 4.88-5 1.57 0 3.03.78 3.96 2.01.93-1.23 2.39-2.01 3.96-2.01 2.74 0 4.88 2.12 4.88 5 0 3.456-2.92 6.471-4.81 8.325a20.77 20.77 0 0 1-1.16 1.077l-.02.01-.005.003h-.002a.75.75 0 0 1-.708 0l-.002-.001Z" />
          </svg>
          <span>{{ c.likes }} me gusta</span>
        </div>
      </div>
    }
  </div>
</div>
