<div class="bg-[var(--color-bg-card)] border border-[var(--color-border)] rounded-2xl p-6 sm:p-8 shadow-[var(--shadow-medium)]">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-[var(--color-border)] gap-2">
    <div>
      <h2 class="text-xl font-bold text-[var(--color-black)]">Reading History</h2>
      <p class="text-xs text-[var(--color-description)]">Capítulos que has leído recientemente</p>
    </div>
  </div>

  <div class="divide-y divide-[var(--color-border)]/50 mt-4">
    @for (item of history; track item.id) {
      <div class="py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <img
            [src]="item.cover"
            [alt]="item.novelTitle"
            class="w-12 h-16 rounded-lg object-cover flex-shrink-0 border border-[var(--color-border)]"
          />
          <div>
            <h3 class="font-bold text-[var(--color-black)] text-base truncate" [title]="item.novelTitle">
              {{ item.novelTitle }}
            </h3>
            <p class="text-sm text-[var(--color-primary)] font-medium">
              {{ item.chapterTitle }}
            </p>
            <span class="text-xs text-[var(--color-description)]">{{ item.readAt }}</span>
          </div>
        </div>

        <app-button
          text="Reanudar"
          variant="outline-primary"
          size="sm"
        />
      </div>
    }
  </div>
</div>
