<div class="container max-w-7xl father__container p-8">
  <div class="mb-4 max-w-2xl mx-auto">
    <a routerLink="/home" class="inline-flex items-center gap-2 text-sm font-semibold text-[var(--color-primary)] hover:underline">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4">
        <path fill-rule="evenodd" d="M17 10a.75.75 0 0 1-.75.75H5.612l4.158 3.96a.75.75 0 1 1-1.04 1.08l-5.5-5.25a.75.75 0 0 1 0-1.08l5.5-5.25a.75.75 0 1 1 1.04 1.08L5.612 9.25H16.25A.75.75 0 0 1 17 10Z" clip-rule="evenodd" />
      </svg>
      Volver al Inicio
    </a>
  </div>
  <div class="bg-[var(--color-bg-card)] rounded-[1.25rem] shadow-[var(--shadow-medium)] p-8 max-w-2xl mx-auto">
    <div class="flex items-center gap-6 mb-8">
      <div class="w-24 h-24 rounded-full bg-[var(--color-primary)] flex items-center justify-center text-4xl font-bold text-[var(--color-white)]">
        {{ user()?.name?.charAt(0) || 'U' }}
      </div>
      <div>
        <h2 class="text-3xl font-bold text-[var(--color-black)]">{{ user()?.name || 'User Name' }}</h2>
        <p class="text-[var(--color-description)]">{{ user()?.email || 'user@example.com' }}</p>
        <span class="inline-block mt-2 px-3 py-1 rounded-full text-sm font-medium bg-[var(--color-primary-light)] text-[var(--color-black-fit)]">
          {{ user()?.roleDisplayName || user()?.role || 'User' }}
        </span>
      </div>
    </div>

    <div class="border-t border-[var(--color-border)] pt-6">
      <h3 class="text-xl font-semibold text-[var(--color-black)] mb-4">Account Information</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <p class="text-sm text-[var(--color-description)] mb-1">User ID</p>
          <p class="text-[var(--color-black)] font-medium">{{ user()?.id || '-' }}</p>
        </div>
        <div>
          <p class="text-sm text-[var(--color-description)] mb-1">Email</p>
          <p class="text-[var(--color-black)] font-medium">{{ user()?.email || '-' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
