<div class="container w-[300px] md:w-[700px] h-[900px] father__container flex items-center justify-center p-4 bg-[var(--color-bg-card)] relative overflow-hidden">
  <div class="w-full rounded-[1.25rem] shadow-[var(--shadow-medium)] p-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-[var(--color-black)] mb-2">Create Account</h2>
      <p class="text-[var(--color-description)]">Join our community today</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Name Field -->
      <div class="space-y-2">
        <label for="name" class="block text-sm font-medium text-[var(--color-black)]">Full Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="w-full px-4 py-3 rounded-[var(--button-border-radius)] bg-[var(--color-background)] border border-[var(--color-border)] text-[var(--color-black)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] transition-all duration-300"
          [class.border-[var(--color-error)]]="isValidField('name')"
          placeholder="Enter your full name"
        >
        <span *ngIf="isValidField('name')" class="text-sm text-[var(--color-error)]">
          {{ getFieldError('name') }}
        </span>
      </div>

      <!-- Username Field -->
      <div class="space-y-2">
        <label for="username" class="block text-sm font-medium text-[var(--color-black)]">Username</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          class="w-full px-4 py-3 rounded-[var(--button-border-radius)] bg-[var(--color-background)] border border-[var(--color-border)] text-[var(--color-black)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] transition-all duration-300"
          [class.border-[var(--color-error)]]="isValidField('username')"
          placeholder="Choose a username"
        >
        <span *ngIf="isValidField('username')" class="text-sm text-[var(--color-error)]">
          {{ getFieldError('username') }}
        </span>
      </div>

      <!-- Email Field -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium text-[var(--color-black)]">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="w-full px-4 py-3 rounded-[var(--button-border-radius)] bg-[var(--color-background)] border border-[var(--color-border)] text-[var(--color-black)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] transition-all duration-300"
          [class.border-[var(--color-error)]]="isValidField('email')"
          placeholder="Enter your email"
        >
        <span *ngIf="isValidField('email')" class="text-sm text-[var(--color-error)]">
          {{ getFieldError('email') }}
        </span>
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <label for="password" class="block text-sm font-medium text-[var(--color-black)]">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="w-full px-4 py-3 rounded-[var(--button-border-radius)] bg-[var(--color-background)] border border-[var(--color-border)] text-[var(--color-black)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] transition-all duration-300"
          [class.border-[var(--color-error)]]="isValidField('password')"
          placeholder="Create a password"
        >
        <span *ngIf="isValidField('password')" class="text-sm text-[var(--color-error)]">
          {{ getFieldError('password') }}
        </span>
      </div>

      <!-- Confirm Password Field -->
      <div class="space-y-2">
        <label for="confirmPassword" class="block text-sm font-medium text-[var(--color-black)]">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="w-full px-4 py-3 rounded-[var(--button-border-radius)] bg-[var(--color-background)] border border-[var(--color-border)] text-[var(--color-black)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] transition-all duration-300"
          [class.border-[var(--color-error)]]="isValidField('confirmPassword')"
          placeholder="Confirm your password"
        >
        <span *ngIf="isValidField('confirmPassword')" class="text-sm text-[var(--color-error)]">
          {{ getFieldError('confirmPassword') }}
        </span>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="registerForm.invalid || isLoading"
        class="w-full py-3 px-6 rounded-[var(--button-border-radius)] bg-[var(--button-primary-bg)] text-[var(--button-tc)] font-bold shadow-[var(--shadow-light)] hover:bg-[var(--button-primary-bg-hover)] hover:shadow-[var(--shadow-medium)] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2"
      >
        <span *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-[var(--button-tc)] border-t-transparent rounded-full"></span>
        {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
      </button>

      <!-- Login Link -->
      <div class="text-center mt-6">
        <p class="text-[var(--color-description)]">
          Already have an account?
          <a routerLink="/auth/login" class="text-[var(--color-primary-dark)] font-semibold hover:underline">Sign in</a>
        </p>
      </div>
      
      <!-- <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-[var(--color-border)]"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 text-[var(--color-description)]">Or continue with email</span>
        </div>
      </div>
        
      <div class="space-y-3 mb-6 flex flex-col gap-2">
        <app-google-login-button
          [isLoading]="isSocialLoading()"
          (clicked)="onSocialLogin('google')"
        />
        <app-facebook-login-button
          [isLoading]="isSocialLoading()"
          (clicked)="onSocialLogin('facebook')"
        />
      </div> -->
    </form>
    
  </div>
  
   <div class="w-full md:block hidden rounded-[1.25rem] shadow-[var(--shadow-medium)] p-8 z-10">
    <!-- Divider -->
     <div class="relative my-6">
      <div class="relative flex justify-center text-sm">
        <span class="px-2 text-[var(--color-bg-card)]">Or continue with email</span>
      </div>
    </div>
      
    <!-- Social Login Buttons -->
    <div class="space-y-3 mb-6 flex flex-col gap-2">
      <app-google-login-button
        [isLoading]="isSocialLoading()"
        (clicked)="onSocialLogin('google')"
      />
      <app-facebook-login-button
        [isLoading]="isSocialLoading()"
        (clicked)="onSocialLogin('facebook')"
      />
    </div>
  </div>

  <div class="bg-register md:block hidden"></div>
</div>
